name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dotnet:
    name: dotnet build (.NET 10)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WorkFlowBasic.slnx

      - name: Build (uyarilar hata sayilir)
        run: dotnet build WorkFlowBasic.slnx --no-restore -c Release -warnaserror

      - name: Guvenlik acigi olan paket kontrolu
        run: |
          dotnet list WorkFlowBasic.csproj package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Bilinen guvenlik acigi olan paket var"
            exit 1
          fi
